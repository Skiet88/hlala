spring:
  application:
    name: hlala-backend

  profiles:
    active: local
  jpa:
    # Off: every DTO is built from data loaded inside the service transaction,
    # so nothing silently depends on lazy loading during view rendering.
    open-in-view: false
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration). Hibernate only
      # checks that the entities match it and refuses to start if they do not.
      ddl-auto: validate

---
spring:
  config:
    activate:
      on-profile: local
  # The database is Supabase Postgres; nothing runs on this machine. Set these
  # from the Supabase project's connection settings. Use the session pooler
  # (port 5432), not the transaction pooler (6543), which breaks the prepared
  # statements the JDBC driver uses, for example:
  #   jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

hlala:
  dev-auth:
    # Trust the X-Dev-User-Id header as identity. LOCAL ONLY - never set this in prod.
    enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

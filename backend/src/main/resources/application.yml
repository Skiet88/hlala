spring:
  application:
    name: hlala-backend

  profiles:
    active: local
  jpa:
    # Off: every DTO is built from data loaded inside the service transaction,
    # so nothing silently depends on lazy loading during view rendering.
    open-in-view: false
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration). Hibernate only
      # checks that the entities match it and refuses to start if they do not.
      ddl-auto: validate

---
spring:
  config:
    activate:
      on-profile: local
  # Postgres from backend/docker-compose.yml. The defaults match that file;
  # override with the environment variables if your database lives elsewhere.
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hlala}
    username: ${DATABASE_USERNAME:hlala}
    password: ${DATABASE_PASSWORD:hlala}

hlala:
  dev-auth:
    # Trust the X-Dev-User-Id header as identity. LOCAL ONLY - never set this in prod.
    enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

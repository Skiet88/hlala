spring:
  application:
    name: hlala-backend

  profiles:
    active: local
  jpa:
    # Off: every DTO is built from data loaded inside the service transaction,
    # so nothing silently depends on lazy loading during view rendering.
    open-in-view: false

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:hlala;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true

hlala:
  dev-auth:
    # Trust the X-Dev-User-Id header as identity. LOCAL ONLY - never set this in prod.
    enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
